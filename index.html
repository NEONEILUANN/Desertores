<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <title>Desertores RA</title>

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>

    <link rel="stylesheet" href="css/style.css">

    <script src="js/tokens.js"></script>
    <script src="js/loader.js"></script>
    <script src="js/app.js"></script>

</head>

<body>

    <a-scene
        id="scene"
        embedded
        vr-mode-ui="enabled: false"
        arjs="trackingMethod: best; sourceType: webcam;">

        <a-assets>

            <img
                id="zarperMaria"
                src="imagens/personagens/Zarper1Maria.png">
             <!-- Personagem 2 -->
            <img
                id="zarJoana"
                src="imagens/personagens/Zarjoana1.png">

            <!-- Modelo 3D -->
            <a-asset-item
                id="S01N"
                src="modelos/itens/S01N.1.glb">

        </a-assets>
        

        <a-marker
            type="pattern"
            url="marcadores/patt/pattern-Marcador1.patt">

            <a-plane
                src="#zarJoana"
                width="1"
                height="1.5"
                position="0 0.75 0"
                material="side: double;">
            </a-plane>

        </a-marker>

        <a-marker
            type="pattern"
            url="marcadores/patt/pattern-Marcador2.patt">

            <a-plane
                src="#zarJoana"
                width="1"
                height="1.5"
                position="0 0.75 0"
                material="side: double">
            </a-plane>

        </a-marker>
        <a-marker
            type="pattern"
            url="marcadores/patt/pattern-Marcador3.patt">

            <a-gltf-model
                src="#S01N"
                scale="0.5 0.5 0.5"
                position="0 0 0">
            </a-gltf-model>

        </a-marker>

        <a-entity camera></a-entity>

    </a-scene>

</body>

</html>
